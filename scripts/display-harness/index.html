<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumaLink — Optical Sender Display Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      color: #58a6ff;
      margin-bottom: 4px;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #8b949e;
    }
    .display-container {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    .hud-bar {
      margin-top: 12px;
      color: #1f2328;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .controls {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 0.75rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input, button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #f0f6fc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #58a6ff;
    }
    button.primary {
      background: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      grid-column: span 2;
      padding: 10px;
    }
    button.primary:hover {
      background: #2ea043;
    }
    button.primary.active {
      background: #da3633;
    }
  </style>
  <script src="./qrcode.min.js"></script>
  <script src="./real-packets.js"></script>
</head>
<body>
  <header>
    <h1>LumaLink Optical Sender Display Harness</h1>
    <p class="subtitle">Controlled Physical Screen Presentation for Real Protocol Transmission (Phase 5B)</p>
  </header>

  <div class="display-container">
    <canvas id="qrCanvas" width="400" height="400"></canvas>
    <div class="hud-bar" id="hudBar">Ready</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="intervalSelect">Frame Presentation Interval</label>
      <select id="intervalSelect">
        <option value="66">66 ms (~15 Hz)</option>
        <option value="50">50 ms (~20 Hz)</option>
        <option value="33">33 ms (~30 Hz)</option>
        <option value="100">100 ms (~10 Hz)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="repetitionSelect">Repetition Factor (R)</label>
      <select id="repetitionSelect">
        <option value="1">R = 1 (Sequential)</option>
        <option value="2">R = 2 (Double hold)</option>
        <option value="3">R = 3 (Triple hold)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="eccSelect">Error Correction (ECC)</label>
      <select id="eccSelect">
        <option value="M">Level M (~15%)</option>
        <option value="L">Level L (~7%)</option>
        <option value="Q">Level Q (~25%)</option>
        <option value="H">Level H (~30%)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="scaleSelect">Pixels / Module (Scale)</label>
      <select id="scaleSelect">
        <option value="8">8 px/mod (360-700px)</option>
        <option value="6">6 px/mod (270-500px)</option>
        <option value="10">10 px/mod (450-900px)</option>
        <option value="4">4 px/mod (Compact)</option>
      </select>
    </div>

    <div class="control-group" style="grid-column: span 2;">
      <label for="sequenceSelect">Test Sequence</label>
      <select id="sequenceSelect">
        <option value="REAL_PACKETS">Real LumaLink Protocol Packets (K=16, 64B Symbol, AEAD Encrypted, LT Fountain)</option>
        <option value="GOLDEN_DATA_PACKET">Phase 5C Pre-Provisioned Test DATA Packet (Decryptable, Session 09e99973...)</option>
        <option value="ABCD">Sequential Test Pattern: Frame A, Frame B, Frame C, Frame D</option>
        <option value="SINGLE_FRAME">Single Static QR (Focus & Distance Calibration)</option>
      </select>
    </div>

    <button id="toggleBtn" class="primary">Start Display Sequence</button>
  </div>

  <script>
    const canvas = document.getElementById('qrCanvas');
    const hudBar = document.getElementById('hudBar');
    const toggleBtn = document.getElementById('toggleBtn');
    const intervalSelect = document.getElementById('intervalSelect');
    const repetitionSelect = document.getElementById('repetitionSelect');
    const eccSelect = document.getElementById('eccSelect');
    const scaleSelect = document.getElementById('scaleSelect');
    const sequenceSelect = document.getElementById('sequenceSelect');

    let isPlaying = false;
    let timerId = null;
    let currentFrameIndex = 0;

    function parsePacketHeader(raw) {
      if (!(raw instanceof Uint8Array) || raw.length < 42) return null;
      if (raw[0] !== 0x4c || raw[1] !== 0x55 || raw[2] !== 0x4d || raw[3] !== 0x41) return null;
      var view = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
      var version = view.getUint8(4);
      var type = view.getUint8(5);
      var flags = view.getUint8(6);
      var sessionIdHex = Array.from(raw.subarray(8, 12))
        .map(function (b) { return b.toString(16).padStart(2, '0'); })
        .join('');
      var blockIndex = view.getUint32(24, false);
      var symbolId = view.getUint32(28, false);
      var k = view.getUint16(32, false);
      var degree = view.getUint16(34, false);
      var payloadLen = view.getUint16(36, false);
      var crc = view.getUint32(38, false);
      return {
        version: version,
        type: type,
        flags: flags,
        sessionIdShort: sessionIdHex,
        blockIndex: blockIndex,
        symbolId: symbolId,
        k: k,
        degree: degree,
        payloadLen: payloadLen,
        crcHex: '0x' + crc.toString(16).padStart(8, '0'),
        wireLength: raw.length
      };
    }

    const realPackets =
      window.LUMALINK_REAL_PACKETS && Array.isArray(window.LUMALINK_REAL_PACKETS.packets)
        ? window.LUMALINK_REAL_PACKETS.packets
        : [];

    // Valid 122-byte golden DATA packet matching pre-provisioned session 09e99973...
    const goldenDataPacket = new Uint8Array([
      76, 85, 77, 65, 1, 2, 2, 0, 9, 233, 153, 115, 196, 120, 68, 45, 175, 96, 43, 175, 118, 177,
      215, 149, 0, 0, 0, 0, 0, 0, 0, 0, 0, 16, 0, 1, 0, 80, 181, 52, 47, 17, 25, 53, 72, 75, 175,
      201, 76, 213, 117, 171, 246, 96, 156, 57, 118, 219, 193, 58, 77, 104, 94, 142, 203, 38, 1, 130,
      137, 114, 161, 40, 121, 242, 182, 215, 70, 253, 85, 75, 227, 196, 191, 85, 238, 238, 254, 17,
      27, 36, 26, 189, 115, 122, 219, 139, 79, 190, 218, 19, 127, 207, 241, 100, 171, 125, 228, 36,
      232, 195, 7, 130, 76, 226, 181, 212, 70, 27, 73, 228, 217, 106
    ]);

    const sequences = {
      REAL_PACKETS: realPackets,
      GOLDEN_DATA_PACKET: [goldenDataPacket],
      ABCD: ['FRAME_A', 'FRAME_B', 'FRAME_C', 'FRAME_D'],
      SINGLE_FRAME: ['LUMALINK-OPTICAL-CALIBRATION-V4']
    };

    function renderQr(payload) {
      const ecc = eccSelect.value;
      const scale = parseInt(scaleSelect.value, 10);
      const data = payload instanceof Uint8Array ? [{ data: payload, mode: 'byte' }] : payload;

      QRCode.toCanvas(
        canvas,
        data,
        {
          errorCorrectionLevel: ecc,
          scale: scale,
          margin: 4,
          color: { dark: '#000000', light: '#ffffff' }
        },
        (err) => {
          if (err) console.error(err);
        }
      );
    }

    function updateHud(payload, frameNum, totalFrames, interval, rep) {
      const hz = Math.round(1000 / interval);
      const header = parsePacketHeader(payload);
      if (header) {
        hudBar.textContent = `Frame ${frameNum}/${totalFrames} | Blk ${header.blockIndex} | Sym ${header.symbolId} | K=${header.k} | deg=${header.degree} | ${header.wireLength} B | Session ${header.sessionIdShort}... | ${interval} ms (${hz} Hz) | R=${rep}`;
      } else {
        hudBar.textContent = `Frame ${frameNum}/${totalFrames} | ${payload} | ${interval} ms (${hz} Hz) | R=${rep}`;
      }
    }

    function tick() {
      if (!isPlaying) return;

      const seqKey = sequenceSelect.value;
      const list = sequences[seqKey];
      if (!list || list.length === 0) {
        hudBar.textContent = 'Error: No packets available for ' + seqKey;
        return;
      }

      const payload = list[currentFrameIndex % list.length];
      const interval = parseInt(intervalSelect.value, 10);
      const rep = parseInt(repetitionSelect.value, 10);
      const frameNum = (currentFrameIndex % list.length) + 1;
      const totalFrames = list.length;

      renderQr(payload);
      updateHud(payload, frameNum, totalFrames, interval, rep);

      currentFrameIndex++;
      timerId = setTimeout(tick, interval * rep);
    }

    toggleBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        toggleBtn.textContent = 'Stop Display';
        toggleBtn.classList.add('active');
        currentFrameIndex = 0;
        tick();
      } else {
        toggleBtn.textContent = 'Start Display Sequence';
        toggleBtn.classList.remove('active');
        if (timerId) clearTimeout(timerId);
      }
    });

    sequenceSelect.addEventListener('change', () => {
      const list = sequences[sequenceSelect.value];
      if (list && list.length > 0) {
        const interval = parseInt(intervalSelect.value, 10);
        const rep = parseInt(repetitionSelect.value, 10);
        renderQr(list[0]);
        updateHud(list[0], 1, list.length, interval, rep);
      }
    });

    // Initial render: real packets if available, otherwise fallback to calibration
    const initialList = sequences[sequenceSelect.value] || sequences.REAL_PACKETS;
    if (initialList && initialList.length > 0) {
      renderQr(initialList[0]);
      updateHud(initialList[0], 1, initialList.length, parseInt(intervalSelect.value, 10), parseInt(repetitionSelect.value, 10));
    } else {
      renderQr(sequences.ABCD[0]);
      hudBar.textContent = 'Ready';
    }
  </script>
</body>
</html>
