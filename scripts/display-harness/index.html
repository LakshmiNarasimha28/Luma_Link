<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumaLink — Optical Sender Display Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      color: #58a6ff;
      margin-bottom: 4px;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #8b949e;
    }
    .display-container {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    .hud-bar {
      margin-top: 12px;
      color: #1f2328;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .controls {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 0.75rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input, button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #f0f6fc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #58a6ff;
    }
    button.primary {
      background: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      grid-column: span 2;
      padding: 10px;
    }
    button.primary:hover {
      background: #2ea043;
    }
    button.primary.active {
      background: #da3633;
    }
  </style>
  <script src="./qrcode.min.js"></script>
  <script src="./real-packets.js"></script>
</head>
<body>
  <header>
    <h1>LumaLink Optical Sender Display Harness</h1>
    <p class="subtitle">Controlled Physical Screen Presentation for Real Protocol Transmission (Phase 5B)</p>
  </header>

  <div class="display-container">
    <canvas id="qrCanvas" width="400" height="400"></canvas>
    <div class="hud-bar" id="hudBar">Ready</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="intervalSelect">Frame Presentation Interval</label>
      <select id="intervalSelect">
        <option value="66">66 ms (~15 Hz)</option>
        <option value="50">50 ms (~20 Hz)</option>
        <option value="33">33 ms (~30 Hz)</option>
        <option value="100">100 ms (~10 Hz)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="repetitionSelect">Repetition Factor (R)</label>
      <select id="repetitionSelect">
        <option value="1">R = 1 (Sequential)</option>
        <option value="2">R = 2 (Double hold)</option>
        <option value="3">R = 3 (Triple hold)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="eccSelect">Error Correction (ECC)</label>
      <select id="eccSelect">
        <option value="M">Level M (~15%)</option>
        <option value="L">Level L (~7%)</option>
        <option value="Q">Level Q (~25%)</option>
        <option value="H">Level H (~30%)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="scaleSelect">Pixels / Module (Scale)</label>
      <select id="scaleSelect">
        <option value="8">8 px/mod (360-700px)</option>
        <option value="6">6 px/mod (270-500px)</option>
        <option value="10">10 px/mod (450-900px)</option>
        <option value="4">4 px/mod (Compact)</option>
      </select>
    </div>

    <div class="control-group" style="grid-column: span 2;">
      <label for="sequenceSelect">Test Sequence</label>
      <select id="sequenceSelect">
        <option value="REAL_INTERLEAVED">Phase 6.4 Real Stream: MANIFEST + KEY_ENVELOPE + 39 DATA Packets</option>
        <option value="GOLDEN_INTERLEAVED_MANIFEST_KEY_FEC">Phase 6.4 Golden Stream: MANIFEST + KEY_ENVELOPE + FEC Packets (Session 09e99973...)</option>
        <option value="GOLDEN_KEY_ENVELOPE_ONLY">Phase 6.3/6.4 Pre-Arranged Key Envelope Only (Sealed to Bob)</option>
        <option value="GOLDEN_MANIFEST_ONLY">Phase 6.2 Dynamic Manifest Only (Session Announcement 09e99973...)</option>
        <option value="REAL_PACKETS">Real LumaLink Protocol Packets (K=16, 64B Symbol, AEAD Encrypted, LT Fountain)</option>
        <option value="GOLDEN_FEC_BLOCK_16">Phase 5C.3 Authenticated LT Block (20 Packets, K=16, 100% Reconstruction)</option>
        <option value="GOLDEN_DATA_PACKET">Phase 5C Pre-Provisioned Test DATA Packet (Decryptable, Session 09e99973...)</option>
        <option value="ABCD">Sequential Test Pattern: Frame A, Frame B, Frame C, Frame D</option>
        <option value="SINGLE_FRAME">Single Static QR (Focus & Distance Calibration)</option>
      </select>
    </div>

    <button id="toggleBtn" class="primary">Start Display Sequence</button>
  </div>

  <script>
    const canvas = document.getElementById('qrCanvas');
    const hudBar = document.getElementById('hudBar');
    const toggleBtn = document.getElementById('toggleBtn');
    const intervalSelect = document.getElementById('intervalSelect');
    const repetitionSelect = document.getElementById('repetitionSelect');
    const eccSelect = document.getElementById('eccSelect');
    const scaleSelect = document.getElementById('scaleSelect');
    const sequenceSelect = document.getElementById('sequenceSelect');

    let isPlaying = false;
    let timerId = null;
    let currentFrameIndex = 0;

    function parsePacketHeader(raw) {
      if (!(raw instanceof Uint8Array) || raw.length < 42) return null;
      if (raw[0] !== 0x4c || raw[1] !== 0x55 || raw[2] !== 0x4d || raw[3] !== 0x41) return null;
      var view = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
      var version = view.getUint8(4);
      var type = view.getUint8(5);
      var flags = view.getUint8(6);
      var sessionIdHex = Array.from(raw.subarray(8, 12))
        .map(function (b) { return b.toString(16).padStart(2, '0'); })
        .join('');
      var blockIndex = view.getUint32(24, false);
      var symbolId = view.getUint32(28, false);
      var k = view.getUint16(32, false);
      var degree = view.getUint16(34, false);
      var payloadLen = view.getUint16(36, false);
      var crc = view.getUint32(38, false);
      return {
        version: version,
        type: type,
        flags: flags,
        sessionIdShort: sessionIdHex,
        blockIndex: blockIndex,
        symbolId: symbolId,
        k: k,
        degree: degree,
        payloadLen: payloadLen,
        crcHex: '0x' + crc.toString(16).padStart(8, '0'),
        wireLength: raw.length
      };
    }

    const realPackets =
      window.LUMALINK_REAL_PACKETS && Array.isArray(window.LUMALINK_REAL_PACKETS.packets)
        ? window.LUMALINK_REAL_PACKETS.packets
        : [];

    // Valid 122-byte golden DATA packet matching pre-provisioned session 09e99973...
    const goldenDataPacket = new Uint8Array([
      76, 85, 77, 65, 1, 2, 2, 0, 9, 233, 153, 115, 196, 120, 68, 45, 175, 96, 43, 175, 118, 177,
      215, 149, 0, 0, 0, 0, 0, 0, 0, 0, 0, 16, 0, 1, 0, 80, 181, 52, 47, 17, 25, 53, 72, 75, 175,
      201, 76, 213, 117, 171, 246, 96, 156, 57, 118, 219, 193, 58, 77, 104, 94, 142, 203, 38, 1, 130,
      137, 114, 161, 40, 121, 242, 182, 215, 70, 253, 85, 75, 227, 196, 191, 85, 238, 238, 254, 17,
      27, 36, 26, 189, 115, 122, 219, 139, 79, 190, 218, 19, 127, 207, 241, 100, 171, 125, 228, 36,
      232, 195, 7, 130, 76, 226, 181, 212, 70, 27, 73, 228, 217, 106
    ]);

    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    const goldenFecBlock16Hex = [
      "4c554d410102020009e99973c478442daf602baf76b1d795000000000000000000100001005006a0178d50e30241d607b84415e1aa108a9b7c14dc2f406d63bbe6032c5754b76cdd84174b22cb78c8de4e6112e053abb344464147e83e3fe6be629bf70662cafc91569819d12506da57e1471861fb9ec471440f",
      "4c554d410102020009e99973c478442daf602baf76b1d79500000000000000010010000d005089cf3006cec5e6819abdc712d3c9f39b95295cf2c0add5fce97bc43aff5514796aaebbeda35ead07c324f41fff89ce047ca810d4897f62ddbf527cdebc15b83dc28a29d1ffdef3cf20beb6dff6a661bf39fe9010",
      "4c554d410102020009e99973c478442daf602baf76b1d7950000000000000002001000010050ee75d96a1596ee79c3bdca2a3ca2b75fd2def8d129c2e2ae7d556e0e40ef30606ea113e14374ec4c5a41f380c96b651c1ddc3d69c73834bcdc74dedb3889da7bb744027eabadb19cedfd9de7cdde6c2feea50ed8",
      "4c554d410102020009e99973c478442daf602baf76b1d7950000000000000003001000060050dc602464c2a8b376866592bd95a196ab77ef66945498b50fd76b315d14a705a13eb134dfcdc0c0070e6212c2336badb3c8ff8f41439c1ce2a69f384068e6b8d50ad8bc9b4723616be2372417dc88a61468a99fa1",
      "4c554d410102020009e99973c478442daf602baf76b1d79500000000000000040010000200508ce4a1ea58944388933442f6dfcd317735e29cfa42a58f634f84fc1fa966f946668f6c896a9e5ac1dd073e8afe5c32037941885f92c6caa1576020e9c1f2eb83838ac278139244ccece7c6b7e4e0a0781842017b",
      "4c554d410102020009e99973c478442daf602baf76b1d7950000000000000005001000030050f59384ea7c2dc0a9a7b6caab6cd4627649b0d406bc855fd1a60d5cbd4a7d49cedaa94bba9465489fba2d435d46345bfa6688ef1a64bf53a2822794255c029d96604a54257b4d9f6bbb7a45e99ed21433ef483c61",
      "4c554d410102020009e99973c478442daf602baf76b1d7950000000000000006001000020050248464fbef44b60ff46d41cfec87c551f210b0fac48d2ed27c26c98192e24796df773f7257e748b3763770ed61f14928c9c10a558caa236dbf4472bc34df61ad038a5c3228f6c6ab89e0d41ff2e24626d71b5ea9",
      "4c554d410102020009e99973c478442daf602baf76b1d7950000000000000007001000060050d19a6997bde49bee9af623f951d59a29c757b9cf4325f92042308d0a699edc3e1c28eae24dca9a8706706a6a389ddcd5f26480fe3b32c768b7318c23f72ccb6bb93bfa70fd1d991f1c3585cbfc4bf8cb4a8183c7",
      "4c554d410102020009e99973c478442daf602baf76b1d79500000000000000080010000600503c5f6b0b03abe9d9a09f7bfe4dc924062703c868e7e99917437c5cbd3088be195ee7ec4050d8c8bff4299730608951dfc5b113f9159494a1572061204f133a0cd50a2d65d652d15fbae75ba0a90032da558ca21b",
      "4c554d410102020009e99973c478442daf602baf76b1d7950000000000000009001000070050eecd05b7194257e002680a21ba3c172570bc13a86ce684d9338915091de9ed67e1ad666855b2f52c9bd276cdc64eb1f26830a7b5a04aae69d87462ff928a49eb5b1fd6cb02573fa029a119f81cbb71280d31b230",
      "4c554d410102020009e99973c478442daf602baf76b1d795000000000000000a001000040050526bc4d6c5b46feac6689b03aed3b18eae044533755228e9b678ad33da5b25958705645fa91e975690cfb54d693db38cd6a66e5b79f7affb29496522c4ac749c1884ad78ed24f38922a73698667d6d9f44a9435b",
      "4c554d410102020009e99973c478442daf602baf76b1d795000000000000000b001000090050097a126720fa6da8cb82a30f1d020a06b488d55f067cef06499fef7f3907a408ffb14ee8b252cf65d605e980cfcddd2e2d3dc873f834fda68a3880eb6f02b9f776027c569e2b22d202db7a974f152896568a0b59",
      "4c554d410102020009e99973c478442daf602baf76b1d795000000000000000c00100005005086cefb38d5b252aaefb3aa7cab6ac634a1f75474a12fcc18afbe1cee6ed78e9a93c1c30a8435bf4f91264d3d913bbe4c075314db4389b1cd3338512a78920f20a52c962fb1aa6ca9fd5db55ba3e39f26d42cb84d",
      "4c554d410102020009e99973c478442daf602baf76b1d795000000000000000d00100001005071f7e0284e8cfdb100d8feca6728ce2048bd61a32702ec80a48cde39d3869ffd8aec40b85fa5d4dc8edd4adf297c56ccf63a81e6a6fcb262c17bfa51c5eb76270a4695a76ad20ee0d9345edbc3cc48c632e14381",
      "4c554d410102020009e99973c478442daf602baf76b1d795000000000000000e001000030050dd230bd7b8ccfb884f908a10a9af5f5479398d2bc8ae31604fc82b422bf3df5ef4bc5e2db9a7d4dd630457e7db05c95b34cd2696618743b42c2253ccea59b31512520994373120b450c15bce6a4725e570afa5a8",
      "4c554d410102020009e99973c478442daf602baf76b1d795000000000000000f00100002005034c59138494b0d89f73e8970cf43de958eb2784dc0879937d3bbff3c43194cc3db37d0b884cbdd298b3fceed8520a86413030fcf4d85d1b7ed7e211aa6d0f39b23f6178c55f77a844e10b2f519f48725c7523dda",
      "4c554d410102020009e99973c478442daf602baf76b1d79500000000000000100010000200503aeed258b5ce3e723a011f3ec618f55744424d1a9b068e1f692fceaba4c595a9f5fbb3dbe3b22f3a2e3d70fac3909551b9e71fe5edd53e25e3f134cd6c0d0fa917d5d1e7f2eca73a9fbf6b71e73c02e31abd3c63",
      "4c554d410102020009e99973c478442daf602baf76b1d7950000000000000011001000020050b611256fa2294cf25a69d5c14f163ca6dd59cd914becb2cea110ddc08f0770b1bf6f939cb9727f11306cf678fd0431243e3f35ca92187b072aefb9416ae70bdf7d06bb9669d402e38b0ba3baa8ef85233325e56d",
      "4c554d410102020009e99973c478442daf602baf76b1d7950000000000000012001000020050e777e48fb792db7fcf929a991f4f37121fc2835acd8fc4bdb325543e23c9a0c96ecc0f6eeabd8ded0db71eaf9498ff51b5ee8805ba817907f89c5274a68da53e5babf9de84e01713874df013e2e3535f0aa9b3f6",
      "4c554d410102020009e99973c478442daf602baf76b1d7950000000000000013001000020050b1547aa3756a9d07642ec5503c5019112e93568885cc4fb13d0b3f3f6eb4bec69c079b6117d799f50129152b538216aafa2381682520678f9626579b4451f7792962e4ebcef8f3c13ea7db12d2837af36ba8dcf4"
    ];
    const goldenFecBlock16Packets = goldenFecBlock16Hex.map(hexToBytes);

    // Phase 6.2 Golden 186-byte MANIFEST packet (matching pre-provisioned session 09e99973...)
    const goldenManifestHex = "4c554d410101000009e99973c478442daf602baf76b1d7950000000000000000001000000090cdcebc3a0101000009e99973c478442daf602baf76b1d795000001925bfa8e000000000000000400000000010040001007a37cbc142093c8b755dc1b10e86cb426374ad16aa853ed0bdfc0b2b86d1c7c6d08077b4795f29ba27c3f7802ba28d26bf8cc55f8b60e6081bbda4e15c7760f1273656e6465722d746573742d6465762d3031000f676f6c64656e2d313032342e62696e";
    const goldenManifestPacket = hexToBytes(goldenManifestHex);

    // Phase 6.3 Golden 165-byte Pre-Arranged KEY_ENVELOPE packet (sealed to Bob for session 09e99973...)
    const goldenKeyEnvelopeHex = "4c554d410104000009e99973c478442daf602baf76b1d795000000000000000100000000007b1696aed80201010009e99973c478442daf602baf76b1d7950a6465766963652d626f6207a37cbc142093c8b755dc1b10e86cb426374ad16aa853ed0bdfc0b2b86d1c7c0102030405060708090a0b0c1935484bafc94cd575abf6609c3976dbc13a4d685e8ecb2601828972a12879f2b6d746fd554be3c4bf55eeeefe111b24";
    const goldenKeyEnvelopePacket = hexToBytes(goldenKeyEnvelopeHex);

    const realManifestPacket =
      window.LUMALINK_REAL_PACKETS && window.LUMALINK_REAL_PACKETS.manifestPacket
        ? window.LUMALINK_REAL_PACKETS.manifestPacket
        : null;

    const realKeyEnvelopePacket =
      window.LUMALINK_REAL_PACKETS && window.LUMALINK_REAL_PACKETS.keyEnvelopePacket
        ? window.LUMALINK_REAL_PACKETS.keyEnvelopePacket
        : null;

    // Helper: create interleaved sequence emitting:
    // MANIFEST -> KEY_ENVELOPE (pre-arranged) -> DATA -> DATA -> DATA -> MANIFEST...
    function createInterleavedSequence(manifestPkt, envelopePkt, dataPackets, interval = 3) {
      const result = [];
      for (let i = 0; i < dataPackets.length; i++) {
        if (i % interval === 0) {
          if (manifestPkt) result.push(manifestPkt);
          if (envelopePkt) result.push(envelopePkt);
        }
        result.push(dataPackets[i]);
      }
      return result;
    }

    const goldenInterleavedPackets = createInterleavedSequence(goldenManifestPacket, goldenKeyEnvelopePacket, goldenFecBlock16Packets, 3);
    const realInterleavedPackets = realManifestPacket ? createInterleavedSequence(realManifestPacket, realKeyEnvelopePacket, realPackets, 3) : realPackets;

    const sequences = {
      GOLDEN_INTERLEAVED_MANIFEST_KEY_FEC: goldenInterleavedPackets,
      GOLDEN_INTERLEAVED_MANIFEST_FEC: goldenInterleavedPackets,
      GOLDEN_KEY_ENVELOPE_ONLY: [goldenKeyEnvelopePacket],
      GOLDEN_MANIFEST_ONLY: [goldenManifestPacket],
      REAL_INTERLEAVED: realInterleavedPackets,
      REAL_PACKETS: realPackets,
      GOLDEN_FEC_BLOCK_16: goldenFecBlock16Packets,
      GOLDEN_DATA_PACKET: [goldenDataPacket],
      ABCD: ['FRAME_A', 'FRAME_B', 'FRAME_C', 'FRAME_D'],
      SINGLE_FRAME: ['LUMALINK-OPTICAL-CALIBRATION-V4']
    };

    function renderQr(payload) {
      const ecc = eccSelect.value;
      const scale = parseInt(scaleSelect.value, 10);
      const data = payload instanceof Uint8Array ? [{ data: payload, mode: 'byte' }] : payload;

      QRCode.toCanvas(
        canvas,
        data,
        {
          errorCorrectionLevel: ecc,
          scale: scale,
          margin: 4,
          color: { dark: '#000000', light: '#ffffff' }
        },
        (err) => {
          if (err) console.error(err);
        }
      );
    }

    function updateHud(payload, frameNum, totalFrames, interval, rep) {
      const hz = Math.round(1000 / interval);
      const header = parsePacketHeader(payload);
      if (header) {
        const typeName = header.type === 1 ? 'MANIFEST' : header.type === 2 ? 'DATA' : 'TYPE_' + header.type;
        if (header.type === 1) {
          hudBar.textContent = `Frame ${frameNum}/${totalFrames} | [${typeName}] | ${header.wireLength} B | Session ${header.sessionIdShort}... | ${interval} ms (${hz} Hz) | R=${rep}`;
        } else {
          hudBar.textContent = `Frame ${frameNum}/${totalFrames} | [${typeName}] Blk ${header.blockIndex} | Sym ${header.symbolId} | K=${header.k} | deg=${header.degree} | ${header.wireLength} B | Session ${header.sessionIdShort}... | ${interval} ms (${hz} Hz) | R=${rep}`;
        }
      } else {
        hudBar.textContent = `Frame ${frameNum}/${totalFrames} | ${payload} | ${interval} ms (${hz} Hz) | R=${rep}`;
      }
    }

    function tick() {
      if (!isPlaying) return;

      const seqKey = sequenceSelect.value;
      const list = sequences[seqKey];
      if (!list || list.length === 0) {
        hudBar.textContent = 'Error: No packets available for ' + seqKey;
        return;
      }

      const payload = list[currentFrameIndex % list.length];
      const interval = parseInt(intervalSelect.value, 10);
      const rep = parseInt(repetitionSelect.value, 10);
      const frameNum = (currentFrameIndex % list.length) + 1;
      const totalFrames = list.length;

      renderQr(payload);
      updateHud(payload, frameNum, totalFrames, interval, rep);

      currentFrameIndex++;
      timerId = setTimeout(tick, interval * rep);
    }

    toggleBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        toggleBtn.textContent = 'Stop Display';
        toggleBtn.classList.add('active');
        currentFrameIndex = 0;
        tick();
      } else {
        toggleBtn.textContent = 'Start Display Sequence';
        toggleBtn.classList.remove('active');
        if (timerId) clearTimeout(timerId);
      }
    });

    sequenceSelect.addEventListener('change', () => {
      const list = sequences[sequenceSelect.value];
      if (list && list.length > 0) {
        const interval = parseInt(intervalSelect.value, 10);
        const rep = parseInt(repetitionSelect.value, 10);
        renderQr(list[0]);
        updateHud(list[0], 1, list.length, interval, rep);
      }
    });

    // Initial render: real packets if available, otherwise fallback to calibration
    const initialList = sequences[sequenceSelect.value] || sequences.REAL_PACKETS;
    if (initialList && initialList.length > 0) {
      renderQr(initialList[0]);
      updateHud(initialList[0], 1, initialList.length, parseInt(intervalSelect.value, 10), parseInt(repetitionSelect.value, 10));
    } else {
      renderQr(sequences.ABCD[0]);
      hudBar.textContent = 'Ready';
    }
  </script>
</body>
</html>
